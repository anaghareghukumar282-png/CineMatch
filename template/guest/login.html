<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        /* LEFT SECTION */
        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #5a7b9e 0%, #4a6fa5 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .left-section::before,
        .left-section::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .left-section::before {
            width: 200px;
            height: 200px;
            top: -50px;
            right: -50px;
        }

        .left-section::after {
            width: 150px;
            height: 150px;
            bottom: -40px;
            left: -40px;
        }

        .left-content {
            position: relative;
            z-index: 1;
        }

        .left-content h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .left-content p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* RIGHT SECTION */
        .right-section {
            flex: 1;
            padding: 60px 40px;
        }

        .form-title {
            text-align: center;
            font-size: 28px;
            color: #333;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            transition: 0.3s;
        }

        .form-control:focus {
            outline: none;
            background: white;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btnLogin {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btnLogin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .form-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .form-footer a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .form-footer a:hover {
            color: #764ba2;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-section {
                padding: 40px 30px;
            }

            .right-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-section">
        <div class="left-content">
            <h2>Welcome Back 🎬</h2>
            <p>
                Log in to rate movies, get personalized recommendations,
                and continue your movie journey with us.
            </p>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right-section">
        <h1 class="form-title">Login</h1>

        <form method="POST" action="{% url 'login_process' %}">
            {% csrf_token %}

            <div class="form-group">
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Enter your username"
                       required>
            </div>

            <div class="form-group">
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="btnLogin">Login</button>
        </form>

        <div class="form-footer">
            Don’t have an account?
            <a href="/guestapp/registration">Register</a>
        </div>
    </div>

</div>

</body>
</html>
