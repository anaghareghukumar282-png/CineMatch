<!-- header.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="{% static 'user/images/star.png' %}" type="favicon/ico" />

  <title>Cine M A T C H</title>

  <link rel="stylesheet" href="{% static 'user/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'user/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'user/css/owl.carousel.css' %}">
  <link rel="stylesheet" href="{% static 'user/css/owl.theme.css' %}">
  <link rel="stylesheet" href="{% static 'user/css/animate.css' %}">
  <link rel="stylesheet" href="{% static 'user/nivo-lightbox/nivo-lightbox.css' %}">
  <link rel="stylesheet" href="{% static 'user/nivo-lightbox/nivo-lightbox-theme.css' %}">
  <!-- <link rel="stylesheet" href="{% static 'user/css/main.css' %}"> -->
  <link rel="stylesheet" href="{% static 'user/css/header.css' %}">

</head>

<body>

  <header class="dev-header">
    <div class="dev-header-inner">

      <!-- Logo -->
      <a href="/userapp/browse-movies" class="dev-logo">
        CINE<span>MATCH</span>
      </a>

      <!-- Search -->
      <div class="dev-search">
        <input type="text" placeholder="Search movies..." />
      </div>

      <!-- Nav -->
      <nav class="dev-nav">
       <!-- <button class="btn">Create Post</button> -->


        {% if request.session.loginid %}
        <div class="dev-profile">
          <span class="avatar">👤</span>
          <div class="dev-dropdown">
            <a href="{% url 'profile' %}">View Profile</a>
            <a href="{% url 'preferences' %}">Preferences</a>
            <a href="{% url 'view_watchlist' %}">My Watchlist</a>
            <hr />
            <a href="{% url 'logout' %}" class="logout">Logout</a>
          </div>
        </div>
        {% else %}
        <a href="{% url 'loginhome' %}" class="login">Login</a>
        <a href="{% url 'registration' %}" class="register">Register</a>
        {% endif %}
      </nav>

    </div>
  </header>


</body>

<style>
    .btn {
        background-color: #ffffff;
        color: rgb(72, 86, 245);
        border: none;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin-right: 20px;
        border: 1px solid rgb(72, 86, 245);
    }
</style>
