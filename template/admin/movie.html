{% load static %}
{% include 'admin/header.html' %}

<style>
.register-card { max-width: 900px; margin: 48px auto; border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; box-shadow: 0 12px 30px rgba(0,0,0,0.12); font-family: Arial, Helvetica, sans-serif; }
.register-left {
  background: linear-gradient(180deg, rgba(5,30,30,0.32), rgba(5,30,30,0.36)), url('{% static "student/img/hero-bg.jpg" %}');
  background-size: cover; background-position: center; background-repeat: no-repeat;
  color: #fff; padding: 48px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:18px; position:relative; overflow:hidden;
}
.register-left::before{content:'';position:absolute;right:6%;top:12%;width:58%;height:68%;background-image:url('{% static "student/img/project-1.jpg" %}');background-size:contain;background-repeat:no-repeat;opacity:0.12;filter:grayscale(60%);pointer-events:none}
.register-left h2{font-size:28px;margin:0 0 6px}
.register-left p{opacity:0.95;margin:0 0 14px}
.btn-signin{border:1px solid rgba(255,255,255,0.3);background:transparent;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none}
.register-right{ background:#fff; padding:40px 36px; }
.register-right h3{margin:0 0 18px;font-size:24px;color:#0f2f2e;text-align:left}
.social-row{display:flex;gap:10px;margin-bottom:18px}
.social-btn{width:36px;height:36px;border-radius:6px;border:1px solid #ddd;display:inline-flex;align-items:center;justify-content:center;color:#666;text-decoration:none}
.or-line{display:flex;align-items:center;gap:12px;margin:14px 0 18px;color:#666;font-weight:600}
.or-line::before,.or-line::after{content:'';flex:1;height:1px;background:#eee}
.form-row{display:flex;flex-direction:column;gap:12px}
.form-row input[type="text"],.form-row input[type="email"],.form-row input[type="password"],.form-row textarea{ padding:12px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px;width:100%; }
.form-actions{display:flex;justify-content:flex-end;margin-top:12px}
.submit-btn{background:#c9d400;color:#0b2e2d;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:700}
@media(max-width:800px){.register-card{grid-template-columns:1fr;}.register-left{text-align:center;align-items:center}}
</style>
 <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-sm-12 col-xl-6">
                        <div class="bg-light rounded h-100 p-4">
                            <h6 class="mb-4">MOVIE REGISTRATION</h6>
                            <form method="post" action="{% url 'movie_insert' %}" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="exampleInputEmail1" name="moviename" value="" placeholder="Movie Name"
                                        aria-describedby="emailHelp">
                                    <br>
                                        <div class="mb-3">
            <label class="form-label">GENRE</label>
           <select id="inputState" name="genreid" class="form-control" required>
                            <option value="">Choose GENRE</option>
                            {% for g in genres %}
                            <option value="{{ g.genreid }}">{{ g.genrename }}</option>
                              {% endfor %}
                      
                            
           </select>
        </div>
        <select class="form-control" name="language" required>
            <option value="">Choose Language</option>
            {% for l in languages %}
            <option value="{{ l.languagename }}">{{ l.languagename }}</option>
            {% endfor %}
        </select>
        <br>
        <input type="text" class="form-control" id="exampleInputEmail1" name="releaseyear" value="" placeholder="Release Year"
                                        aria-describedby="emailHelp">
        <br>
        <textarea class="form-control" id="exampleInputEmail1" name="description" placeholder="Description"
                                            aria-describedby="emailHelp"></textarea>
        <br>
        <input type="text" class="form-control" id="exampleInputEmail1" name="duration" value="" placeholder="Duration"
                                            aria-describedby="emailHelp">
        <br>
        <input type="number" step="0.1" class="form-control" id="exampleInputEmail1" name="rating" value="" placeholder="Rating"
                                        aria-describedby="emailHelp">
        <br>
        <input type="file" class="form-control" id="exampleInputFile1" name="poster" placeholder="Poster"
                                        aria-describedby="emailHelp">
        <br>
                                </div>  
                               
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </form>
                        </div>
                    </div>

{% include 'admin/footer.html' %}
